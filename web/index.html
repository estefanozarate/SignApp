<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sello — demo</title>
<style>
  :root{
    --tinta:#101821; --hueso:#E7E9E3; --papel:#FBFBF8;
    --intaglio:#0E5548; --carmin:#96263F; --grafito:#5C6670;
    --linea:rgba(16,24,33,.13);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--hueso);color:var(--tinta);
    font:15px/1.55 'IBM Plex Sans',system-ui,sans-serif;
    display:grid;place-items:center;min-height:100vh;padding:32px 20px}
  main{width:min(560px,100%)}
  h1{font:400 34px/1.1 'Bodoni Moda',Didot,Georgia,serif;letter-spacing:-.4px;margin-bottom:6px}
  .ceja{font:400 10.5px/1 ui-monospace,monospace;letter-spacing:1.7px;
    text-transform:uppercase;color:var(--grafito);margin-bottom:14px}
  p{color:var(--grafito);margin-bottom:20px}
  .tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:20px;
    padding:24px;margin-bottom:16px}
  button{font:600 15px/1 inherit;height:52px;padding:0 22px;border:0;border-radius:14px;
    background:var(--intaglio);color:#F4F6F2;cursor:pointer;width:100%;margin-bottom:8px}
  button.ghost{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 1px rgba(16,24,33,.24)}
  button:disabled{opacity:.5;cursor:default}
  canvas{display:block;margin:0 auto;image-rendering:pixelated;border-radius:6px}
  .mono{font:12px/1.7 ui-monospace,monospace;word-break:break-all;color:var(--grafito)}
  dl{display:grid;gap:0}
  .fila{display:flex;justify-content:space-between;gap:16px;padding:13px 0;
    border-top:1px solid var(--linea);font-size:13.5px}
  .fila:first-child{border-top:0}
  .fila dt{color:var(--grafito);font-size:12.5px}
  .pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;
    border-radius:999px;font-size:11.5px;font-weight:600}
  .ok{background:rgba(14,85,72,.1);color:var(--intaglio)}
  .mal{background:rgba(150,38,63,.1);color:var(--carmin)}
  .esp{background:rgba(142,100,18,.12);color:#8E6412}
  .oculto{display:none}
</style>

<main>
  <p class="ceja">Demo del lado navegador</p>
  <h1>Sello</h1>
  <p>
    El dominio emite una petición, tu teléfono la verifica contra el propio dominio por
    HTTPS y responde con su identidad y una prueba de posesión de su clave privada.
  </p>

  <div class="tarjeta">
    <dl>
      <div class="fila"><dt>Identidad del dominio</dt><dd class="mono" id="dominio">…</dd></div>
      <div class="fila"><dt>App emparejada</dt><dd id="estadoTel"><span class="pill esp">Ninguna</span></dd></div>
      <div class="fila"><dt>Estado</dt><dd id="estadoCanal"><span class="pill esp">Inactivo</span></dd></div>
    </dl>
  </div>

  <div class="tarjeta oculto" id="cajaQr">
    <canvas id="qr"></canvas>
    <p class="mono" style="text-align:center;margin:14px 0 0" id="pieQr"></p>
  </div>

  <div class="tarjeta" id="resultado" hidden></div>

  <button id="btnEntrar">Emparejar un teléfono</button>
  <button id="btnOlvidar" class="ghost">Olvidar el emparejamiento</button>
</main>

<script type="module">
import qrcode from './vendor-qrcode.js';

/**
 * Lado navegador — §4, §9 y §24 de diseno_app.md.
 *
 * El dominio (server/servidor.mjs) es quien emite las peticiones y guarda su
 * clave privada. Esta página solo las pide y muestra el QR: no tiene ninguna
 * clave propia, porque una página estática no puede guardar un secreto.
 */
const DOMINIO = 'http://127.0.0.1:8787';

const $ = (id) => document.getElementById(id);
const pill = (c, t) => `<span class="pill ${c}">${t}</span>`;
const estado = (c, t) => { $('estadoCanal').innerHTML = pill(c, t); };

const leerApp = () => JSON.parse(localStorage.getItem('sello.app') || 'null');
function pintar() {
  const a = leerApp();
  $('estadoTel').innerHTML = a ? pill('ok', a.app_id.slice(0, 8) + '··') : pill('esp', 'Ninguna');
  $('btnEntrar').textContent = a ? 'Pedir el secreto al teléfono' : 'Emparejar un teléfono';
  $('btnOlvidar').style.display = a ? '' : 'none';
}
pintar();

function mostrarQr(payload, pie) {
  $('cajaQr').classList.remove('oculto');
  $('pieQr').textContent = pie;
  const qr = qrcode(0, 'M');
  qr.addData(payload, 'Byte');
  qr.make();
  const n = qr.getModuleCount(), margen = 4;
  const escala = Math.max(2, Math.floor(340 / (n + margen * 2)));
  const lado = (n + margen * 2) * escala;
  const c = $('qr');
  c.width = c.height = lado;
  c.style.width = c.style.height = lado + 'px';
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, lado, lado);
  ctx.fillStyle = '#101821';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
    if (qr.isDark(y, x)) ctx.fillRect((x + margen) * escala, (y + margen) * escala, escala, escala);
}

function contar(hasta, alExpirar) {
  const t = setInterval(() => {
    const q = Math.max(0, hasta - Math.floor(Date.now() / 1000));
    $('pieQr').textContent = `Caduca en ${Math.floor(q / 60)}:${String(q % 60).padStart(2, '0')}`;
    if (q <= 0) { clearInterval(t); alExpirar(); }
  }, 1000);
  return () => clearInterval(t);
}

/** Espera larga: la petición queda abierta hasta que el teléfono responde. */
async function esperar(requestId, hasta) {
  estado('esp', 'Esperando al teléfono');
  while (Date.now() / 1000 < hasta) {
    try {
      const r = await fetch(`${DOMINIO}/respuesta/${requestId}`);
      if (r.status === 200) { estado('ok', 'Respuesta recibida'); return r.json(); }
      if (r.status === 410) break;
    } catch {
      await new Promise(res => setTimeout(res, 1000));
    }
  }
  estado('esp', 'Inactivo');
  return null;
}

async function operar(purpose, accion) {
  const c = await (await fetch(`${DOMINIO}/peticion`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ purpose, action: accion, ttl: 180 }),
  })).json();

  mostrarQr(c.qr, 'Escanéalo con Sello');
  const parar = contar(c.expires_at, () => {});
  const r = await esperar(c.request_id, c.expires_at);
  parar();
  $('cajaQr').classList.add('oculto');
  $('resultado').hidden = false;

  if (!r) { $('resultado').innerHTML = pill('mal', 'El código caducó'); return null; }
  if (r.type === 'DENIED') { $('resultado').innerHTML = pill('mal', 'Rechazado desde el teléfono'); return null; }
  return { peticion: c, respuesta: r };
}

$('btnEntrar').onclick = async () => {
  $('btnEntrar').disabled = true;
  try {
    const emparejada = leerApp();
    const res = await operar(
      emparejada ? 'SECRET_REQUEST' : 'PAIR',
      emparejada ? 'Recuperar tu acceso' : 'Vincular este dispositivo',
    );
    if (!res) return;
    const { peticion, respuesta } = res;

    if (respuesta.type !== 'APP_IDENTITY') {
      $('resultado').innerHTML = pill('mal', 'Respuesta inesperada');
      return;
    }

    // §9 — el dominio verificaría aquí la prueba de posesión con la clave
    // pública que acompaña. Esa comprobación vive en el servidor, no en esta
    // página: una página estática no puede custodiar el registro.
    localStorage.setItem('sello.app', JSON.stringify({
      app_id: respuesta.app_id,
      app_public_key: respuesta.app_public_key,
      app_encryption_key: respuesta.app_encryption_key,
      request_id: peticion.request_id,
    }));
    pintar();

    $('resultado').innerHTML = `${pill('ok', 'Identidad recibida')}
      <p class="mono" style="margin-top:12px">app_id ${respuesta.app_id}</p>
      <p style="margin-top:8px;font-size:13px">Llegó con prueba de posesión. La
      verificación de esa prueba es del §9 y va en la Fase 2.</p>`;
  } finally {
    $('btnEntrar').disabled = false;
  }
};

$('btnOlvidar').onclick = () => {
  localStorage.removeItem('sello.app');
  pintar();
  $('resultado').hidden = true;
};

// La identidad del dominio se consulta creando una petición de prueba.
(async () => {
  try {
    const c = await (await fetch(`${DOMINIO}/peticion`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ purpose: 'PAIR', ttl: 1 }),
    })).json();
    const v = await (await fetch(`${DOMINIO}/verificar/${c.request_id}`)).json();
    $('dominio').textContent = v.domain_id.replace(/(.{4})/g, '$1 ').trim().slice(0, 24) + '…';
  } catch {
    $('dominio').textContent = 'servidor apagado';
  }
})();
</script>
